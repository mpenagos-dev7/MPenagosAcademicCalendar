<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall 2026 — Command Center</title>
<style>
:root{
  --ink:#12100c;
  --ink-2:#4a453b;
  --ink-3:#857e70;
  --paper:#f7f4ec;
  --card:#fffdf8;
  --gold:#cfb991;
  --gold-deep:#8e7c4e;
  --rule:#e3ddcd;
  --rule-strong:#c9c1ab;
  --red:#a3341f;
  --green:#3f6b45;
  --shadow:0 1px 0 rgba(18,16,12,.05), 0 8px 24px -18px rgba(18,16,12,.5);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,select,textarea,input{font:inherit;color:inherit}
a{color:var(--gold-deep)}

/* ---------- masthead ---------- */
.masthead{
  background:var(--ink);
  color:var(--paper);
  border-bottom:3px solid var(--gold);
  position:sticky;top:0;z-index:50;
}
.masthead-in{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.wordmark{font-family:var(--serif);font-size:22px;letter-spacing:.02em;font-weight:600;margin:0;line-height:1.1}
.wordmark span{color:var(--gold)}
.semester{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a9a294;margin:2px 0 0}
.masthead-meta{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#a9a294;padding-bottom:4px}
.masthead-meta b{color:var(--gold);font-weight:600}
.pagenav{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;gap:2px}
.pagenav button{
  background:transparent;border:0;border-bottom:3px solid transparent;
  color:#a9a294;padding:9px 16px;margin-bottom:-3px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
}
.pagenav button:hover{color:var(--paper)}
.pagenav button[aria-selected="true"]{color:var(--ink);background:var(--gold);border-bottom-color:var(--gold)}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
h2.section{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.section-note{color:var(--ink-2);margin:0 0 16px;font-size:14px;max-width:62ch}
.block{margin-bottom:38px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow)}

/* ---------- weekly grid ---------- */
.gridscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.weekgrid{min-width:760px;background:var(--card);border:1px solid var(--rule-strong);border-radius:3px;overflow:hidden}
.wg-head{display:grid;grid-template-columns:64px repeat(5,1fr);background:var(--ink);color:var(--paper)}
.wg-head div{padding:9px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.wg-head div.today{background:var(--gold);color:var(--ink)}
.wg-body{display:grid;grid-template-columns:64px repeat(5,1fr);position:relative}
.wg-times{position:relative}
.wg-times .hr{height:56px;border-bottom:1px solid var(--rule);position:relative}
.wg-times .hr span{position:absolute;top:-7px;right:7px;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.wg-col{position:relative;border-left:1px solid var(--rule)}
.wg-col .hr{height:56px;border-bottom:1px solid var(--rule)}
.wg-col.today{background:rgba(207,185,145,.13)}
.evt{
  position:absolute;left:3px;right:3px;border-radius:3px;padding:5px 7px;overflow:hidden;
  border-left:3px solid var(--c,#999);background:var(--tint,#eee);
}
.evt b{display:block;font-size:12px;font-weight:700;line-height:1.25}
.evt em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink-2);line-height:1.35}
.nowline{position:absolute;left:64px;right:0;height:0;border-top:2px solid var(--red);z-index:5;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.nowline::after{content:"NOW";position:absolute;right:4px;top:-14px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--red)}

/* ---------- course cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.ccard{padding:14px 15px;border-left:4px solid var(--c)}
.ccard h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.ccard .code{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.ccard dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.ccard dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.ccard dd{margin:0;color:var(--ink-2)}

/* ---------- generic table ---------- */
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;
}
table.data td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}

/* ---------- assignment rows ---------- */
.arow.done{opacity:.5}
.arow.overdue .duecell b{color:var(--red)}
.atitle{font-weight:600;line-height:1.3}
.ameta{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;margin-top:2px}
.duecell b{display:block;font-size:13px;white-space:nowrap}
.duecell span{font-family:var(--mono);font-size:10px;color:var(--ink-3);white-space:nowrap}
select.status,select.prio{
  border:1px solid var(--rule-strong);background:var(--paper);border-radius:2px;padding:4px 6px;font-size:12px;cursor:pointer;
}
select.status[data-v="Done"]{background:#e4eee2;border-color:#a9c4a5;color:var(--green)}
select.status[data-v="In Progress"]{background:#fbf0d8;border-color:var(--gold);color:var(--gold-deep)}
select.prio[data-v="High"]{color:var(--red);border-color:#d8a99c}
textarea.notes{
  width:100%;min-width:150px;border:1px solid var(--rule);background:var(--paper);border-radius:2px;
  padding:5px 7px;font-size:12.5px;resize:vertical;min-height:32px;font-family:var(--sans);
}
textarea.notes:focus,select:focus,button:focus-visible,input:focus{outline:2px solid var(--gold-deep);outline-offset:1px}
.tagpill{
  display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;border:1px solid var(--rule-strong);color:var(--ink-2);white-space:nowrap;
}
.tagpill.exam{background:#f4dcd6;border-color:#d8a99c;color:var(--red)}

/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--rule-strong);padding-bottom:0}
.tabs button{
  background:transparent;border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0;
  padding:8px 13px;cursor:pointer;font-size:12.5px;color:var(--ink-2);margin-bottom:-1px;
}
.tabs button:hover{background:rgba(207,185,145,.2)}
.tabs button[aria-selected="true"]{background:var(--card);border-color:var(--rule-strong);color:var(--ink);font-weight:700}
.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tabs button .cnt{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:6px}

/* ---------- overview ---------- */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1;font-weight:600}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.stat.alarm b{color:var(--red)}
.daygroup{margin-bottom:18px}
.dayhead{
  display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:0;
}
.dayhead h4{margin:0;font-family:var(--serif);font-size:17px;font-weight:600}
.dayhead .rel{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-left:auto}
.dayhead.is-today{border-bottom-color:var(--red)}
.dayhead.is-today .rel{color:var(--red)}
.progrow{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center;padding:6px 0;font-size:12.5px}
.bar{height:7px;background:var(--rule);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--gold-deep))}
.progrow .pct{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right}

/* ---------- calendar ---------- */
.calbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{
  border:1px solid var(--rule-strong);background:var(--card);border-radius:2px;padding:6px 12px;cursor:pointer;font-size:12.5px;
}
.btn:hover{background:var(--gold);border-color:var(--gold)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.calbar .title{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 4px}
.month{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule-strong);border-radius:3px;overflow:hidden;background:var(--card)}
.month .dow{background:var(--ink);color:#a9a294;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;text-align:center}
.mcell{min-height:104px;border-top:1px solid var(--rule);border-left:1px solid var(--rule);padding:5px 6px}
.mcell:nth-child(7n+1){border-left:0}
.mcell.out{background:rgba(227,221,205,.32)}
.mcell.today{background:rgba(207,185,145,.24);box-shadow:inset 0 0 0 2px var(--gold)}
.mcell .dnum{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:block;margin-bottom:3px}
.mcell.today .dnum{color:var(--ink);font-weight:700}
.chip{
  display:block;font-size:10.5px;line-height:1.25;padding:2px 4px;border-radius:2px;margin-bottom:2px;
  border-left:3px solid var(--c);background:var(--tint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default;
}
.chip.done{text-decoration:line-through;opacity:.55}
.more{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.holiday{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold-deep);background:rgba(207,185,145,.3);padding:2px 4px;border-radius:2px;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcell.holiday-cell{background:repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(207,185,145,.16) 7px,rgba(207,185,145,.16) 14px)}
.miles{list-style:none;margin:0;padding:0}
.miles li{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.miles li:last-child{border-bottom:0}
.miles .dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--gold-deep);flex:0 0 76px;padding-top:2px}
.daylist .empty{color:var(--ink-3);font-size:13px;padding:14px 0}

/* ---------- campus ---------- */
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.legend div{display:flex;gap:9px;font-size:13px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--card)}
.legend code{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold-deep);flex:0 0 44px}
.hops{list-style:none;margin:0;padding:0}
.hops li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px;align-items:baseline}
.hops li:last-child{border-bottom:0}
.hops .when{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);flex:0 0 74px}
.hops .gap{margin-left:auto;font-family:var(--mono);font-size:11px;white-space:nowrap}
.hops .gap.tight{color:var(--red);font-weight:700}
.drop{
  border:2px dashed var(--rule-strong);border-radius:3px;padding:26px 18px;text-align:center;background:var(--card);
}
.drop p{margin:0 0 10px;color:var(--ink-2);font-size:13.5px}
.drop.over{border-color:var(--gold-deep);background:#fbf6e9}
#mapImg{max-width:100%;border:1px solid var(--rule-strong);border-radius:3px;display:block}
.savenote{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}

/* ---------- misc ---------- */
.callout{border-left:3px solid var(--gold-deep);background:#fbf6e9;padding:10px 14px;font-size:13px;border-radius:0 3px 3px 0;margin:0 0 16px}
.callout b{font-weight:700}
.policy{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.policy li{margin-bottom:5px}
.emptystate{padding:26px 18px;text-align:center;color:var(--ink-2);font-size:13.5px}
.addbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.addbar input[type="text"]{flex:1 1 200px;border:1px solid var(--rule-strong);background:var(--card);border-radius:2px;padding:6px 9px}
.addbar input[type="date"]{border:1px solid var(--rule-strong);background:var(--card);border-radius:2px;padding:6px 9px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:99px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:99;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;
  padding:10px 12px;background:var(--card);border:1px solid var(--rule);border-radius:3px;
}
.toolbar input[type="search"]{
  flex:1 1 180px;min-width:150px;border:1px solid var(--rule-strong);background:var(--paper);
  border-radius:2px;padding:6px 10px;font-size:13px;
}
.toolbar select{border:1px solid var(--rule-strong);background:var(--paper);border-radius:2px;padding:6px 8px;font-size:12.5px}
.toolbar .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.fcount{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:auto}
.filtered{box-shadow:inset 0 0 0 2px var(--gold)}
@media print{
  .masthead,.toolbar,.tabs,.calbar,.addbar,.drop,.toast{display:none!important}
  body{background:#fff}
  .card{box-shadow:none}
  textarea.notes{border:0;background:transparent;resize:none}
  select{border:0;background:transparent;appearance:none}
  .wrap{padding:0;max-width:none}
  #page-command[hidden],#page-tracker[hidden]{display:none}
  table.data{font-size:11px}
  .daygroup,.mcell,tr{break-inside:avoid}
}
.urg{
  display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 5px;border-radius:2px;margin-top:4px;white-space:nowrap;font-weight:700;
}
.urg.overdue{background:var(--red);color:#fff}
.urg.today{background:#e0562f;color:#fff}
.urg.tomorrow{background:#dd8a1a;color:#fff}
.urg.soon{background:#f0c862;color:#3a2f10}
.urg.week{background:#e6dfc9;color:#5a5340}
.urg.two,.urg.later{background:transparent;color:var(--ink-3);border:1px solid var(--rule-strong);font-weight:500}
.urg.done{background:#dbe8d9;color:var(--green)}
.urg.none{background:transparent;color:var(--ink-3);border:1px dashed var(--rule-strong);font-weight:500}
tr.arow.crit td{background:rgba(224,86,47,.06)}

.urgstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-bottom:18px}
.ubox{padding:10px 12px;border-radius:3px;border:1px solid var(--rule);background:var(--card);text-align:left}
.ubox b{display:block;font-family:var(--serif);font-size:26px;line-height:1.05}
.ubox span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ubox.l0{border-color:var(--red);background:#fbeae6}.ubox.l0 b{color:var(--red)}
.ubox.l1{border-color:#e0562f;background:#fdefe9}.ubox.l1 b{color:#c9491f}
.ubox.l2{border-color:var(--gold);background:#fdf6e6}

.examgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.examcard{padding:15px 16px;border-left:5px solid var(--c);position:relative}
.examcard .when{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.examcard h4{margin:3px 0 2px;font-size:16px;font-weight:700}
.examcard .big{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1;margin:6px 0 2px}
.examcard .cover{font-size:12.5px;color:var(--ink-2);margin:8px 0 0;line-height:1.4}
.examcard .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--rule)}
input.score{
  width:96px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:2px;padding:4px 7px;font-size:12px;
}
input.score:not(:placeholder-shown){background:#e4eee2;border-color:#a9c4a5;font-weight:700}
.gradeblock{margin-bottom:26px;padding:15px 17px;border-left:5px solid var(--c)}
.gradeblock h3{margin:0 0 2px;font-size:16px;font-weight:700}
.gradeblock .sub{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.gradeblock table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
.gradeblock td{padding:5px 0;border-bottom:1px solid var(--rule)}
.gradeblock td:last-child{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;padding-left:12px}
.gradeblock tr:last-child td{border-bottom:0;font-weight:700}
.pbox{margin-top:12px;font-size:13px;line-height:1.5}
.pbox h5{margin:0 0 3px;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--gold-deep)}
.pbox p{margin:0 0 10px;color:var(--ink-2)}
.icsbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- daily command center ---------- */
.hero{margin-bottom:26px}
.hero .date{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.hero h2{font-family:var(--serif);font-size:32px;font-weight:600;margin:4px 0 0;letter-spacing:-.015em}
.hero .sum{color:var(--ink-2);margin:6px 0 0;font-size:14px}
.today2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.today2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.panel > header{
  display:flex;align-items:baseline;gap:8px;padding:11px 15px;border-bottom:1px solid var(--rule);background:var(--ink);
}
.panel > header h3{margin:0;font-size:12px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.panel > header .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#a9a294;letter-spacing:.08em}
.panel .body{padding:5px 15px}
.panel .foot{padding:9px 15px;border-top:1px solid var(--rule);background:rgba(227,221,205,.28);font-size:12px;color:var(--ink-2)}

.cls{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:flex-start}
.cls:last-child{border-bottom:0}
.cls .tm{flex:0 0 74px;font-family:var(--mono);font-size:11px;line-height:1.45;color:var(--ink-2)}
.cls .tm b{display:block;font-size:13px;color:var(--ink)}
.cls .bd{flex:1;min-width:0}

const KEY = "purdue_f26_tracker_v1";
let state = { edits:{}, custom:[], map:null };
let saveTimer=null, memoryOnly=false;

async function loadState(){
  try{
    if(!window.storage) { memoryOnly=true; return; }
    const r = await window.storage.get(KEY);
    if(r && r.value){ const p=JSON.parse(r.value); state = Object.assign(state,p); }
  }catch(e){ /* first run: no key yet */ }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(memoryOnly || !window.storage){ toast("Saved for this session"); return; }
    try{ await window.storage.set(KEY, JSON.stringify(state)); toast("Saved"); }
    catch(e){ toast("Couldn't save — try again"); }
  }, 350);
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1300);
}
function edit(id){ return state.edits[id] || {}; }
function setEdit(id,k,v){ (state.edits[id] = state.edits[id] || {})[k]=v; save(); }

function allItems(){ return ITEMS.concat(state.custom); }

/* ---- urgency ---- */
const URG=[
  {k:"overdue",label:"Overdue"},{k:"today",label:"Due today"},{k:"tomorrow",label:"Due tomorrow"},
  {k:"soon",label:"Within 3 days"},{k:"week",label:"This week"},{k:"two",label:"Within 2 weeks"},
  {k:"later",label:"Later"},{k:"none",label:"No date"},{k:"done",label:"Done"}
];
function urgency(it){
  if(itemStatus(it)==="Done") return {k:"done",label:"Done",rank:8};
  if(!it.due) return {k:"none",label:"TBA",rank:7};
  const n=daysBetween(today(),parseD(it.due));
  if(n<0)  return {k:"overdue", label:Math.abs(n)+(Math.abs(n)===1?" day late":" days late"), rank:0};
  if(n===0)return {k:"today",   label:"Today", rank:1};
  if(n===1)return {k:"tomorrow",label:"Tomorrow", rank:2};
  if(n<=3) return {k:"soon",    label:"In "+n+" days", rank:3};
  if(n<=7) return {k:"week",    label:"In "+n+" days", rank:4};
  if(n<=14)return {k:"two",     label:"In "+n+" days", rank:5};
  return    {k:"later",  label:"In "+n+" days", rank:6};
}
function isCritical(it){
  const u=urgency(it);
  if(u.rank>4) return false;
  return u.rank<=1 || it.type==="Exam" || itemPrio(it)==="High";
}

/* ============================================================
   4. Date helpers
   ============================================================ */
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
function parseD(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function key(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmtLong(d){ return DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate(); }
function fmtShort(d){ return MON[d.getMonth()].slice(0,3)+" "+d.getDate(); }
function relative(d){
  const n=daysBetween(today(),d);
  if(n===0) return "Today"; if(n===1) return "Tomorrow"; if(n===-1) return "Yesterday";
  if(n<0) return Math.abs(n)+" days ago";
  return "in "+n+" days";
}
function mins(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function fmtTime(hhmm){
  let [h,m]=hhmm.split(":").map(Number); const ap = h>=12?"PM":"AM"; h=h%12||12;
  return h+":"+String(m).padStart(2,"0")+" "+ap;
}

/* ============================================================
   5. Weekly grid
   ============================================================ */
const START_H=7, END_H=18, PX=56;
function renderGrid(host){
  const t = new Date(); const dow = t.getDay();
  let head = '<div class="wg-head"><div></div>';
  ["Monday","Tuesday","Wednesday","Thursday","Friday"].forEach((d,i)=>{
    head += '<div class="'+(dow===i+1?"today":"")+'">'+d+'</div>';
  });
  head += '</div>';

  let times='<div class="wg-times">';
  for(let h=START_H;h<END_H;h++){
    times += '<div class="hr"><span>'+((h%12)||12)+" "+(h<12?"AM":"PM")+'</span></div>';
  }
  times += '</div>';

  let cols="";
  for(let d=1; d<=5; d++){
    let inner="";
    for(let h=START_H;h<END_H;h++) inner+='<div class="hr"></div>';
    MEETINGS.filter(m=>m.d===d).forEach(m=>{
      const c=C[m.c];
      const top=(mins(m.s)-START_H*60)/60*PX;
      const hgt=Math.max(30,(mins(m.e)-mins(m.s))/60*PX-3);
      inner += '<div class="evt" style="top:'+top+'px;height:'+hgt+'px;--c:'+c.c+';--tint:'+c.tint+'">'
        + '<b>'+m.label+'</b><em>'+fmtTime(m.s)+" – "+fmtTime(m.e)+'</em><em>'+m.room+'</em></div>';
    });
    cols += '<div class="wg-col '+(dow===d?"today":"")+'">'+inner+'</div>';
  }

  let now="";
  const nowMin = t.getHours()*60+t.getMinutes();
  if(dow>=1 && dow<=5 && nowMin>=START_H*60 && nowMin<=END_H*60){
    now = '<div class="nowline" style="top:'+((nowMin-START_H*60)/60*PX)+'px"></div>';
  }
  host.innerHTML = '<div class="weekgrid">'+head+'<div class="wg-body">'+times+cols+now+'</div></div>';
}

function timeRank(it){
  const m=(it.time||"").match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m) return 24*60+1;
  let h=+m[1]; const ap=m[3].toUpperCase();
  if(ap==="PM"&&h<12) h+=12; if(ap==="AM"&&h===12) h=0;
  return h*60+(+m[2]);
}
function classesOn(dow){ return MEETINGS.filter(m=>m.d===dow).sort((a,b)=>mins(a.s)-mins(b.s)); }
function dueOn(ymd){
  return allItems().filter(i=>i.due===ymd && itemStatus(i)!=="Done")
    .sort((a,b)=>timeRank(a)-timeRank(b) || (a.type==="Exam"?-1:1));
}

function todayPanelHTML(){

    + (upcomingDates.length?' <button class="btn" id="toggleWeekDue" style="margin-left:8px;padding:3px 9px;font-size:11px">Show due this week</button>':'')
    + '</div>'

}
function greeting(){
  const hr=new Date().getHours();
  return hr<12?"Good morning.":hr<17?"Good afternoon.":"Good evening.";
}
function summaryLine(cls,due,nowMin){
  const left=cls.filter(m=>mins(m.e)>nowMin).length;
  const od=allItems().filter(i=>i.due&&parseD(i.due)<today()&&itemStatus(i)!=="Done").length;
  const bits=[];
  bits.push(left?left+" class"+(left>1?"es":"")+" left today":"no classes left today");
  bits.push(due.length?due.length+" item"+(due.length>1?"s":"")+" due":"nothing due");
  if(od) bits.push(od+" past due");
  return bits.join(" · ");
}

function setupMap(){
  const zone=document.getElementById("mapZone"), drop=document.getElementById("drop"),
        input=document.getElementById("mapInput"), note=document.getElementById("mapNote");
  function show(url){
    zone.innerHTML='<img id="mapImg" src="'+url+'" alt="Campus map">'+
      '<div style="margin-top:10px"><button class="btn" id="mapClear">Remove map</button></div>';
    document.getElementById("mapClear").onclick=()=>{ state.map=null; save(); setupMap(); note.textContent="Map removed."; };
  }
  if(state.map){ show(state.map); return; }
  function handle(file){
    if(!file || !file.type.startsWith("image/")){ note.textContent="That file isn't an image."; return; }
    const fr=new FileReader();
    fr.onload=()=>{
      const url=fr.result;
      if(url.length > 3_500_000){
        show(url);
        note.textContent="Showing your map, but it's too large to store — it will disappear on reload. Try a smaller image.";
        return;
      }
      state.map=url; save(); show(url); note.textContent="Map saved.";
    };
    fr.readAsDataURL(file);
  }
  input.onchange=e=>handle(e.target.files[0]);
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>handle(e.dataTransfer.files[0]));
}

/* ---- filters ---- */
const F = { q:"", type:"All types", status:"Any status", hideDone:false };
function filterOn(){ return F.q || F.type!=="All types" || F.status!=="Any status" || F.hideDone; }
function keep(it){
  if(F.hideDone && itemStatus(it)==="Done") return false;
  if(F.status!=="Any status" && itemStatus(it)!==F.status) return false;
  if(F.type!=="All types" && it.type!==F.type) return false;
  if(F.q){
    const hay=(it.title+" "+it.type+" "+(it.note||"")+" "+C[it.course].code+" "+itemNotes(it)).toLowerCase();
    if(!hay.includes(F.q.toLowerCase())) return false;
  }
  return true;
}
function applyF(list){ return list.filter(keep); }

function row(it,hideDate){
  const st=itemStatus(it), c=C[it.course], d=it.due?parseD(it.due):null;
  const over = d && d<today() && st!=="Done";
  const u=urgency(it);

  else due += '<b>TBA</b><span>no date yet</span>';

  return '<tr class="arow '+(st==="Done"?"done":"")+' '+(over?"overdue":"")+' '+(isCritical(it)?"crit":"")+'" data-id="'+it.id+'">'
    + (hideDate?"":due)
    + '<td><div class="atitle">'+esc(it.title)+'</div>'
      + '<div class="ameta">'+esc(it.type)+(it.time&&hideDate?" · "+esc(it.time):"")+'</div>'

      + (it.note?'<div style="font-size:12px;color:var(--ink-2);margin-top:4px;max-width:44ch">'+esc(it.note)+'</div>':'')
    + '</td>'
    + '<td><span class="tagpill '+(it.type==="Exam"?"exam":"")+'" style="border-color:'+c.c+'55;background:'+c.tint+'">'+c.code+'</span></td>'
    + '<td style="font-size:12px;color:var(--ink-2)">'+esc(it.weight||"—")+'</td>'
    + '<td><select class="status" data-k="status" data-v="'+st+'">'
      + ["Not Started","In Progress","Done"].map(o=>'<option'+(o===st?" selected":"")+'>'+o+'</option>').join("")
      + '</select>'
      + (it.type==="Exam"?'<br><input class="score" data-k="score" placeholder="score" value="'+esc(edit(it.id).score||"")+'">':'')
      + '</td>'
    + '<td><select class="prio" data-k="prio" data-v="'+itemPrio(it)+'">'
      + ["Low","Medium","High"].map(o=>'<option'+(o===itemPrio(it)?" selected":"")+'>'+o+'</option>').join("")
      + '</select></td>'
    + '<td><textarea class="notes" data-k="notes" rows="1" placeholder="Add a note…">'+esc(itemNotes(it))+'</textarea></td>'
    + '</tr>';
}
function wireRows(host){
  host.querySelectorAll(".arow").forEach(tr=>{
    const id=tr.dataset.id;
    tr.querySelectorAll("select,textarea").forEach(el=>{
      const k=el.dataset.k;
      const handler=()=>{
        setEdit(id,k,el.value);
        if(el.tagName==="SELECT") el.dataset.v=el.value;
        if(k==="status"){
          tr.classList.toggle("done", el.value==="Done");
          buildTabs();
          if(!document.getElementById("page-command").hidden){ buildCommand(); }
          else if(activeTab==="overview"||activeTab==="exams") renderTracker();
        }
      };
      el.addEventListener("change",handler);
      if(el.tagName==="TEXTAREA") el.addEventListener("input",()=>setEdit(id,"notes",el.value));
    });
  });
}

let calMode="month", calAnchor=today();
function calendarShell(){
  return '<div class="calbar">'
    + '<button class="btn" id="calPrev" aria-label="Previous">‹</button>'
    + '<button class="btn" id="calNext" aria-label="Next">›</button>'
    + '<button class="btn" id="calToday">Today</button>'
    + '<span class="title" id="calTitle"></span>'
    + '<span style="margin-left:auto;display:flex;gap:4px">'
    + '<button class="btn" data-mode="day">Day</button>'
    + '<button class="btn" data-mode="week">Week</button>'
    + '<button class="btn" data-mode="month">Month</button></span></div>'
    + '<div id="calView"></div>';
}
function renderCalendar(){
  const byDate={};
  applyF(allItems().filter(i=>i.due)).forEach(i=>{ (byDate[i.due]=byDate[i.due]||[]).push(i); });
  const view=document.getElementById("calView"), title=document.getElementById("calTitle");
  document.querySelectorAll("[data-mode]").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.mode===calMode);
    b.onclick=()=>{ calMode=b.dataset.mode; renderCalendar(); };
  });
  document.getElementById("calPrev").onclick=()=>{ shift(-1); renderCalendar(); };
  document.getElementById("calNext").onclick=()=>{ shift(1); renderCalendar(); };
  document.getElementById("calToday").onclick=()=>{ calAnchor=today(); renderCalendar(); };

  if(calMode==="month"){
    title.textContent = MON[calAnchor.getMonth()]+" "+calAnchor.getFullYear();
    view.innerHTML = monthHTML(byDate);
  } else if(calMode==="week"){
    const s=weekStart(calAnchor), e=new Date(s); e.setDate(e.getDate()+6);
    title.textContent = fmtShort(s)+" – "+fmtShort(e);
    view.innerHTML = rangeHTML(s,7,byDate);
  } else {
    title.textContent = fmtLong(calAnchor);
    view.innerHTML = rangeHTML(calAnchor,1,byDate);
  }
  wireRows(view);
}
function shift(n){
  const d=new Date(calAnchor);
  if(calMode==="month") d.setMonth(d.getMonth()+n);
  else if(calMode==="week") d.setDate(d.getDate()+7*n);
  else d.setDate(d.getDate()+n);
  calAnchor=d;
}
function weekStart(d){ const s=new Date(d); s.setDate(s.getDate()-s.getDay()); return s; }
function monthHTML(byDate){
  const first=new Date(calAnchor.getFullYear(),calAnchor.getMonth(),1);
  const start=weekStart(first);
  let h='<div class="month">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>'<div class="dow">'+d+'</div>').join("");
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const out=d.getMonth()!==calAnchor.getMonth();
    const isT=key(d)===key(today());
    const items=(byDate[key(d)]||[]);
    let chips=items.slice(0,3).map(it=>{
      const c=C[it.course];
      return '<span class="chip '+(itemStatus(it)==="Done"?"done":"")+'" style="--c:'+c.c+';--tint:'+c.tint+'" title="'+esc(it.title)+'">'+esc(short(it))+'</span>';
    }).join("");
    if(items.length>3) chips += '<span class="more">+'+(items.length-3)+' more</span>';
    const hol = HOLIDAYS[key(d)];
    const holChip = hol ? '<span class="holiday">'+esc(hol)+'</span>' : '';
    h += '<div class="mcell '+(out?"out":"")+' '+(isT?"today":"")+' '+(hol?"holiday-cell":"")+'"><span class="dnum">'+d.getDate()+'</span>'+holChip+chips+'</div>';
    if(i>=34 && new Date(start.getFullYear(),start.getMonth(),start.getDate()+i+1).getMonth()!==calAnchor.getMonth()) break;
  }
  return h+'</div>';
}
function short(it){
  const c=C[it.course].code.split(" ")[0];
  return c+" · "+(it.title.length>26?it.title.slice(0,26)+"…":it.title);
}
function rangeHTML(start,n,byDate){
  let h='<div class="daylist">';
  for(let i=0;i<n;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const items=(byDate[key(d)]||[]).sort((a,b)=>C[a.course].code<C[b.course].code?-1:1);
    const isT=key(d)===key(today());
    h += '<div class="daygroup"><div class="dayhead '+(isT?"is-today":"")+'"><h4>'+fmtLong(d)+'</h4>'
       + '<span class="rel">'+relative(d)+'</span></div>';
    if(HOLIDAYS[key(d)]) h += '<div class="callout" style="margin:8px 0 4px">'+esc(HOLIDAYS[key(d)])+'</div>';
    const classes = HOLIDAYS[key(d)] && /no classes/i.test(HOLIDAYS[key(d)]) ? [] : MEETINGS.filter(m=>m.d===d.getDay());
    if(classes.length){
      h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">'
        + classes.sort((a,b)=>mins(a.s)-mins(b.s)).map(m=>'<span class="tagpill" style="background:'+C[m.c].tint+';border-color:'+C[m.c].c+'55">'
          + m.label+" "+fmtTime(m.s)+" · "+m.room+'</span>').join("")
        + '</div>';
    }
    h += items.length ? table(items,true) : '<div class="empty">Nothing due.</div>';
    h += '</div>';
  }
  return h+'</div>';
}

/* ============================================================
   7b. Apple Calendar (.ics) export
   ============================================================ */
function icsFold(line){
  if(line.length<=74) return line;
  let out=line.slice(0,74), rest=line.slice(74);
  while(rest.length>73){ out+="\r\n "+rest.slice(0,73); rest=rest.slice(73); }
  return out+"\r\n "+rest;
}
function icsEsc(t){ return String(t==null?"":t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function p2(n){ return String(n).padStart(2,"0"); }
function icsDay(ymd){ return ymd.replace(/-/g,""); }
function icsStamp(ymd,h,m){ return icsDay(ymd)+"T"+p2(h)+p2(m)+"00"; }
function icsAlarm(trigger,text){
  return ["BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:"+trigger,"DESCRIPTION:"+icsEsc(text),"END:VALARM"];
}
function icsEvent(it,stampNow){
  if(!it.due) return [];
  const c=C[it.course];
  const isExam=it.type==="Exam";
  const title=(isExam?"EXAM — ":"")+c.code+": "+it.title;
  const desc=[
    it.type, it.weight?"Worth: "+it.weight:"", it.time?"When: "+it.time:"",
    "Instructor: "+c.instructor, it.note||""
  ].filter(Boolean).join("\n");

  let dt=[], alarms=[];
  const range=(it.time||"").match(/(\d{1,2}):(\d{2})\s*[\u2013\u2014-]\s*(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(range){
    let sh=+range[1], eh=+range[3]; const ap=range[5].toUpperCase();
    if(ap==="PM"){ if(sh<12) sh+=12; if(eh<12) eh+=12; } else { if(sh===12) sh=0; if(eh===12) eh=0; }
    dt=["DTSTART:"+icsStamp(it.due,sh,+range[2]),"DTEND:"+icsStamp(it.due,eh,+range[4])];
    alarms=icsAlarm("-P2D","In 2 days: "+title).concat(icsAlarm("-PT2H","Starting soon: "+title));
  } else if(/11:59\s*PM/i.test(it.time||"")){
    dt=["DTSTART:"+icsStamp(it.due,23,0),"DTEND:"+icsStamp(it.due,23,59)];
    alarms=icsAlarm("-PT11H","Due tonight: "+title);
  } else {
    const end=new Date(parseD(it.due)); end.setDate(end.getDate()+1);
    dt=["DTSTART;VALUE=DATE:"+icsDay(it.due),"DTEND;VALUE=DATE:"+icsDay(key(end))];
    alarms=icsAlarm("-PT9H","Due today: "+title);
  }
  return ["BEGIN:VEVENT","UID:"+it.id+"-fall2026@purdue.local","DTSTAMP:"+stampNow]
    .concat(dt)
    .concat([
      "SUMMARY:"+icsEsc(title),
      "DESCRIPTION:"+icsEsc(desc),
      "CATEGORIES:"+icsEsc(c.code),
      isExam?"PRIORITY:1":"PRIORITY:5",
      "TRANSP:TRANSPARENT"
    ])
    .concat(alarms)
    .concat(["END:VEVENT"]);
}
function buildICS(items,calName){
  const n=new Date();
  const stampNow=n.getUTCFullYear()+p2(n.getUTCMonth()+1)+p2(n.getUTCDate())+"T"
    +p2(n.getUTCHours())+p2(n.getUTCMinutes())+p2(n.getUTCSeconds())+"Z";
  let lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Fall 2026 Command Center//EN",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+icsEsc(calName),
    "X-WR-TIMEZONE:America/Indiana/Indianapolis"];
  items.filter(i=>i.due).forEach(i=>{ lines=lines.concat(icsEvent(i,stampNow)); });
  lines.push("END:VCALENDAR");
  return lines.map(icsFold).join("\r\n")+"\r\n";
}
function downloadICS(items,calName,filename){
  const withDates=items.filter(i=>i.due);
  if(!withDates.length){ toast("Nothing with a date to export"); return; }
  try{
    const blob=new Blob([buildICS(withDates,calName)],{type:"text/calendar;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename+".ics"; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
    toast(withDates.length+" events exported");
  }catch(e){ toast("Export failed — try the desktop app"); }
}
function icsScope(scope){
  const all=allItems();
  if(scope==="exams") return {items:all.filter(i=>i.type==="Exam"),name:"Fall 2026 Exams",file:"fall-2026-exams"};
  if(scope==="filtered") return {items:applyF(all),name:"Fall 2026 Coursework",file:"fall-2026-coursework"};
  if(scope==="30"){
    const t=today();
    return {items:all.filter(i=>i.due&&daysBetween(t,parseD(i.due))>=-1&&daysBetween(t,parseD(i.due))<=30),
      name:"Fall 2026 — Next 30 Days",file:"fall-2026-next-30-days"};
  }
  if(C[scope]) return {items:all.filter(i=>i.course===scope),name:C[scope].code+" — Fall 2026",file:C[scope].code.replace(/\s+/g,"-").toLowerCase()};
  return {items:all,name:"Fall 2026 Coursework",file:"fall-2026-all"};
}
function wireICS(host){
  host.querySelectorAll("[data-ics]").forEach(b=>{
    b.onclick=()=>{ const s=icsScope(b.dataset.ics); downloadICS(s.items,s.name,s.file); };
  });
}

const IBE_CODO_TIMELINE = [
  {date:"Sep 4, 2026", event:"Last day to drop without a record"},
  {date:"Nov 24, 2026", event:"Last day to drop with a W"},
  {date:"Dec 17, 2026 (Thu, 5pm)", event:"✱ SHORT ANSWER SURVEY DUE \u2014 submit now, for a SPRING 2027 CODO. IBE only requires 1 completed semester, not 2 \u2014 this is the semester that counts."},
  {date:"Dec 14-19, 2026", event:"Fall 2026 finals week \u2014 your grades post (survey is submitted before this, reviewed after)"},
  {date:"Late Dec 2026 / early Jan 2027", event:"Purdue reviews your CODO request using your just-posted Fall grades and GPA"},
  {date:"Before Spring 2027 classes start", event:"Decision arrives by email. If approved \u2014 you're an IBE student starting Spring 2027."},
  {date:"If not approved", event:"You stay in General Business, keep building GPA, and can reapply for Fall 2027 with a stronger transcript."}
];

const CODO_PROGRAMS = {
  ibe: {
    name:"IBE (single major)", c:"#0f766e",
    credits:"120", semesters:"8 (standard 4-year map)",
    gpa:"2.5 minimum to CODO, 3.0+ for specific courses.",
    admit:"Holistic review on space-available basis. Very competitive.",
    caveat:true
  },
  ibeie: {
    name:"IBE + IE (double degree)", c:"#7c4ea8",
    credits:"141", semesters:"9",
    gpa:"3.00+ to add IE as second major (after you're in IBE).",
    admit:"Once in IBE, you can petition to add IE. Requirements TBD per advisors.",
    caveat:false
  }
};

function codoStatus(id, fallback){ const e=edit("codo-"+id); return e.status || fallback; }

function codoProgress(programKey){
  const list = IBE_CODO_REQS.filter(r=>r.programs.includes(programKey) && r.credits>0);
  const done = list.filter(r=>codoStatus(r.id,r.status)==="done").length;
  return {done, total:list.length};
}

function programCardHTML(key){
  const p=CODO_PROGRAMS[key], prog=codoProgress(key);
  return '<article class="card cmpcard" style="--c:'+p.c+'">'
    + '<span class="lbl">CODO target</span><h3>'+p.name+'</h3>'
    + '<div class="big">'+p.credits+' <span style="font-size:14px;font-family:var(--sans);color:var(--ink-2);font-weight:400">credit hrs</span></div>'
    + '<div class="lbl">'+p.semesters+'</div>'
    + '<dl><dt>GPA to watch</dt><dd>'+esc(p.gpa)+'</dd>'
    + '<dt>Admission notes</dt><dd>'+esc(p.admit)+'</dd></dl>'
    + '<div style="margin-top:12px"><span class="statuspill inprogress">'+prog.done+' / '+prog.total+' course reqs done</span>'
    + (p.caveat?' <span class="statuspill note">confirm w/ advisor</span>':'')
    + '</div></article>';
}

function reqRowHTML(r){
  const st=codoStatus(r.id, r.status);
  const pillsForPrograms = r.programs.map(pk=>'<span class="statuspill" style="border:1px solid '+CODO_PROGRAMS[pk].c+'55;color:'+CODO_PROGRAMS[pk].c+';background:transparent">'+CODO_PROGRAMS[pk].name.split(" ")[0]+'</span>').join(" ");
  return '<div class="reqrow arow" data-id="codo-'+r.id+'">'
    + '<span class="rc">'+esc(r.code)+'</span>'
    + '<span class="rt"><b>'+esc(r.title)+(r.credits?' <span style="font-weight:400;color:var(--ink-3);font-size:11px">· '+r.credits+' cr</span>':'')+'</b>'
    + '<div class="prog">'+pillsForPrograms+'</div>'
    + (r.note?'<p>'+esc(r.note)+'</p>':'')
    + '</span>'
    + '<select class="status" data-k="status" data-v="'+st+'">'
      + [["done","✓ Done"],["inprogress","In progress"],["todo","Not started"]].map(o=>'<option value="'+o[0]+'"'+(o[0]===st?" selected":"")+'>'+o[1]+'</option>').join("")
    + '</select></div>';
}

function buildTransfer(){
  const host=document.getElementById("page-transfer");
  const cs = creditSummary();
  let h = '<p class="eyebrow">Two-phase plan: IBE first, then IBE+IE</p>'
    + '<h2 class="section">General Business &rarr; IBE &rarr; IBE + IE</h2>'
    + '<p class="section-note">Start by CODOing into IBE (single major). Once you are established in IBE, add IE as a second major. Everything here is a planning draft, confirm specifics with advisors before any official move.</p>';

  h += '<div class="callout" style="background:#fdefe9;border-left-color:#e0562f"><b>Correction:</b> I previously said Fall 2027 was your realistic CODO target, that was wrong. IBE only requires <b>1 completed semester</b> (not 2, that is the double-degree rule). The short-answer survey is due Thursday of THIS Fall 2026 finals week, submitted before grades post and reviewed after. <b>Spring 2027 is realistically in play</b> if your Fall grades and GPA come in where they need to be.</div>';

  h += '<div class="callout"><b>Where you are right now:</b> ECON 25100 is done via AP (direct match). ACCT 20000 counts (new code for MGMT 20000). MA 16500, CHM 11510/11520, SCLA 10200, and ENGL 10800 are all in progress and feed the CODO requirements. Still confirm whether CHM 11510 satisfies "CHM 11500 or PHYS 17200," and get the survey submitted by Dec 17.</div>';

  h += '<h3 style="font-family:var(--serif);font-size:19px;margin:26px 0 4px">Your credits, by the numbers</h3>'
    + '<p style="font-size:12px;color:var(--ink-3);margin:0 0 10px">An AP score only tells you whether you cleared Purdue\u2019s pass threshold for that exam \u2014 it isn\u2019t the credit hours itself. Each credit number below comes from the actual Purdue course your score unlocked.</p>'
    + '<button class="card" id="toggleCreditHistory" style="padding:14px 16px;width:100%;text-align:left;cursor:pointer;border:1px solid var(--rule);font:inherit;display:block">'
    + '<div class="statgrid" style="margin-bottom:16px">'
      + stat(cs.ap,"AP credits confirmed")
      + stat(cs.fall,"Fall 2026 in progress")
      + stat(cs.total,"total once fall posts")
    + '</div>'
    + creditBarHTML("ibe") + creditBarHTML("ibeie")
    + '<p style="margin:10px 0 0;font-size:11.5px;color:var(--ink-3)">Bars assume all Fall 2026 courses pass. Only Microeconomics (plus possibly World History) maps to actual IBE requirements, the rest (Precalc, Statistics, CS Principles) land as free elective credit, not requirement-fulfilling credit.</p>'
    + '<p style="margin:12px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep)">▾ Tap to see every class counted, by semester</p>'
    + '</button>'
    + '<div class="inner" id="creditHistoryBody" style="display:none;padding:14px 0 4px">' + creditHistoryHTML() + '</div>';


  h += '<h3 style="font-family:var(--serif);font-size:19px;margin:30px 0 12px">Phase 1: CODO into IBE (single major)</h3>'
    + '<div class="cmpgrid">' + programCardHTML("ibe") + '</div>';

  h += '<h4 style="font-family:var(--serif);font-size:16px;margin:20px 0 8px">CODO eligibility checklist for IBE</h4>'
    + '<p style="font-size:13px;color:var(--ink-2);margin:0 0 10px">Update status as you get grades. The progress count above auto-updates.</p>'
    + '<div class="card" style="padding:6px 16px">' + IBE_CODO_REQS.map(reqRowHTML).join("") + '</div>';

  h += '<h4 style="font-family:var(--serif);font-size:16px;margin:20px 0 8px">Corrected timeline, targeting Spring 2027</h4>'
    + '<div class="card tablewrap"><table class="data"><tbody>'
    + IBE_CODO_TIMELINE.map(t=>'<tr><td style="font-family:var(--mono);font-size:11px;color:var(--gold-deep);white-space:nowrap;width:170px">'+esc(t.date)+'</td><td><b>'+esc(t.event)+'</b></td></tr>').join("")
    + '</tbody></table></div>';

  h += '<h4 style="font-family:var(--serif);font-size:16px;margin:20px 0 8px">Only take classes that count toward IBE this semester onward</h4>'
    + '<div class="card" style="padding:14px 16px">'
    + '<p style="margin:0 0 10px">Good news, every course you are currently in already counts. For any remaining electives or add/drop decisions this fall, stick to courses that map directly onto IBE\u2019s list: an Engineering IBE Core Selective, a Business Method Selective, or general Human Cultures/Humanities credit (which your AP World History may have already covered).</p>'
    + '<ul class="policy">'
      + '<li>Do not add random gen-eds, check the IBE course list first so every new credit hour double-counts.</li>'
      + '<li>If you have room for one more course, PHYS 17200 (Modern Mechanics) is worth taking now or in Spring, it is core to IBE and one of the two accepted options for your Chem/Physics requirement.</li>'
      + '<li>Submit the short-answer survey by <b>Dec 17, 2026, 5pm</b> regardless of whether your Fall grades are final yet.</li>'
    + '</ul></div>';

  h += '<h4 style="font-family:var(--serif);font-size:16px;margin:20px 0 8px">If approved, Spring 2027 as an IBE student</h4>'
    + '<div class="card" style="padding:14px 16px">'
    + '<p style="margin:0">You would register for IBE-exclusive courses: ENGR 13300, IBE 29110 (or MGMT 11000), EPICS/VIP I, MA 16600, and PHYS 17200 if not already done. This lines up closely with IBE\u2019s own "Spring 1st Year" sample plan.</p>'
    + '</div>';

  h += '<hr style="border:0;border-top:2px solid var(--rule-strong);margin:32px 0">'
    + '<h3 style="font-family:var(--serif);font-size:19px;margin:26px 0 12px">Phase 2: Add IE as a second major (optional)</h3>'
    + '<p style="font-size:13px;color:var(--ink-2);margin:0 0 16px">Once you are in IBE and have a semester or two on record, you can petition to add Industrial Engineering, turning your degree into the 9-semester double. This section is a draft, <b>confirm timeline and requirements with an IE advisor.</b></p>'
    + '<div class="cmpgrid">' + programCardHTML("ibeie") + '</div>'
    + '<div class="callout" style="background:#f9d6e6;border-left-color:#b5427a"><b>To do once you are in IBE:</b> Meet with an IE advisor to confirm (1) when you can petition to add IE, (2) any GPA/course requirements beyond IBE\u2019s own, and (3) whether 9 semesters total is realistic from your position.</div>';

  host.innerHTML = h;
  wireRows(host);

  const tch = document.getElementById("toggleCreditHistory");
  if(tch) tch.onclick=()=>{
    const body = document.getElementById("creditHistoryBody");
    body.style.display = body.style.display==="none" ? "block" : "none";
  };
}

/* ============================================================
   8. Boot
   ============================================================ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function switchPage(p){
  document.getElementById("page-command").hidden = p!=="command";
  document.getElementById("page-tracker").hidden = p!=="tracker";
  document.getElementById("page-transfer").hidden = p!=="transfer";
  document.getElementById("nav-command").setAttribute("aria-selected",p==="command");
  document.getElementById("nav-tracker").setAttribute("aria-selected",p==="tracker");
  document.getElementById("nav-transfer").setAttribute("aria-selected",p==="transfer");
  window.scrollTo({top:0,behavior:"instant"});
}

(async function init(){
  await loadState();
  const t=new Date();
  document.getElementById("todayStamp").textContent = DOW[t.getDay()].slice(0,3)+" "+MON[t.getMonth()].slice(0,3)+" "+t.getDate();
  buildCommand();
  buildTabs();
  setupToolbar();
  renderTracker();
  buildTransfer();
  document.getElementById("nav-command").onclick=()=>switchPage("command");
  document.getElementById("nav-tracker").onclick=()=>switchPage("tracker");
  document.getElementById("nav-transfer").onclick=()=>switchPage("transfer");
  setInterval(()=>{
    if(!document.getElementById("page-command").hidden) buildCommand();
    const g=document.getElementById("gridB"); if(g) renderGrid(g);
  }, 60000);
})();
</script>
